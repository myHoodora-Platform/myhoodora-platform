# Local development database: `pnpm db:up`, then point apps/api/.env at
#   MONGODB_URI=mongodb://localhost:27017/myhoodora?directConnection=true
# A one-node replica set, because the API uses transactions (comment likes, moderation, ads).
# Data lives in the `mongo-data` volume; `pnpm db:down` stops it and keeps the data.
services:
  mongo:
    image: mongo:8.2
    container_name: myhoodora-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Starts the replica set the first time (named localhost:27017 so the API on this Mac can reach it).
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
