<!doctype html>
<!--
  App Store search results asset, 3840 × 2560 (3:2). Rendered to ../app-store-search.png by render.mjs.
  Apple's art safe area: 2168 × 1030 at x 836, y 765 (creative-assets-specifications); on iPhone the whole
  3:2 card shows, elsewhere it's cropped towards that box, so the words, the phone's screen and the floating
  bubbles all sit inside it and the rest is backdrop.

  Built like Apple's own examples (developer.apple.com/app-store/asset-best-practices): one idea, a short line
  that adds to the picture, the real app. The phone is Apple's official iPhone 17 Pro Max bezel (Apple Design
  Resources, bezels/), the screen is our For Sale screenshot, and the two bubbles are cut pixel-for-pixel from
  the chat screenshot (screenshots-ios/4-chat-offer.png): find it nearby, message a neighbour, agree a price.
  Behind the phone, the logo's roof and four-pane window: the phone is home.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 3840px; height: 2560px; overflow: hidden; }
  body { position: relative; font-family: "Outfit", system-ui, sans-serif; color: #0b3f3a; background:
    radial-gradient(30% 38% at 64% 40%, rgba(253,95,70,.13) 0%, rgba(253,95,70,0) 100%),
    radial-gradient(45% 55% at 10% 100%, rgba(17,112,106,.12) 0%, rgba(17,112,106,0) 100%),
    linear-gradient(135deg, #fffaf5 0%, #f6fbf9 55%, #e6f5f1 100%); }

  /* The logo's roof and window over the phone. */
  .roof { position: absolute; left: 0; top: 0; width: 3840px; height: 2560px; }

  /* Apple's bezel over our screenshot; the bezel's screen opening is 1320 × 2868 at (75, 66) of 1470 × 3000. */
  .phone { position: absolute; left: 1990px; top: 600px; width: 1000px; height: 2041px; filter: drop-shadow(0 70px 90px rgba(11,63,58,.28)) drop-shadow(0 18px 30px rgba(11,63,58,.12)); }
  .phone .screen { position: absolute; overflow: hidden; isolation: isolate; left: 51.02px; top: 44.9px; width: 897.96px; height: 1951.02px; background: #fff url("../screenshots-ios/2-for-sale.png") 0 0 / 100% 100% no-repeat; border-radius: 120px; }
  .phone .bezel { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* The For Sale shot has a washed-out status bar (the header's blur); the chat shot's is crisp. Same device and
     position; "darken" keeps whichever is darker, so the glyphs come through and the backgrounds don't seam. */
  .phone .status { position: absolute; left: 0; top: 27.2px; width: 100%; height: 81.6px; background: url("../screenshots-ios/4-chat-offer.png") 0 -27.2px / 100% auto no-repeat; mix-blend-mode: darken; }

  /* Bubbles cut from the chat screenshot at their exact bounds and corners, 1.3× (the screenshot is 1320 wide). */
  .bubble { position: absolute; background-image: url("../screenshots-ios/4-chat-offer.png"); background-repeat: no-repeat; background-size: 1716px auto;
            box-shadow: 0 34px 60px rgba(11,63,58,.20), 0 8px 18px rgba(11,63,58,.10); }
  .sent { left: 1640px; top: 1418px; width: 834.6px; height: 163.8px; background-position: -819px -1625px; border-radius: 78px 78px 18px 78px; }
  .reply { left: 1430px; top: 1620px; width: 977.6px; height: 163.8px; background-position: -62.4px -1890.2px; border-radius: 78px 78px 78px 18px; }

  .copy { position: absolute; left: 900px; top: 830px; width: 1040px; }
  .pill { display: inline-flex; align-items: center; gap: 18px; padding: 20px 36px 20px 28px; border-radius: 999px; background: #fff;
          border: 3px solid #d5ebe6; color: #11706a; font-size: 48px; font-weight: 700; box-shadow: 0 10px 24px rgba(11,63,58,.06); }
  .pill svg { width: 56px; height: 56px; }
  h1 { margin-top: 44px; font-size: 124px; line-height: 1.02; font-weight: 800; letter-spacing: -0.025em; }
  h1 span { color: #f0533a; }
</style>
</head>
<body>
  <svg class="roof" viewBox="0 0 3840 2560">
    <path d="M1720 676 L2490 286 L3260 676" fill="none" stroke="#fd5f46" stroke-width="130" stroke-linecap="round" stroke-linejoin="round" />
    <g fill="#11706a">
      <rect x="2433" y="424" width="52" height="52" rx="12" /><rect x="2495" y="424" width="52" height="52" rx="12" />
      <rect x="2433" y="486" width="52" height="52" rx="12" /><rect x="2495" y="486" width="52" height="52" rx="12" />
    </g>
  </svg>

  <div class="phone">
    <div class="screen"><div class="status"></div></div>
    <img class="bezel" src="bezels/iphone-17-pro-max-cosmic-orange-portrait.png" alt="" />
  </div>

  <div class="bubble sent"></div>
  <div class="bubble reply"></div>

  <div class="copy">
    <div class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      Only verified neighbours
    </div>
    <h1>Know your<br />neighbours.<br /><span>Love your street.</span></h1>
  </div>
</body>
</html>
