name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types

      # API unit tests (Jest) and web unit tests (Vitest).
      - name: Unit tests
        run: pnpm run test

      # The real API against an in-memory MongoDB replica set; only Firebase is stubbed. No secrets needed.
      - name: API integration tests
        run: pnpm run test:e2e:api

      - name: Build
        run: pnpm run build

  browser:
    name: Browser tests (signed-out flows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Firebase web config is public (it ships in the browser bundle). Set these as repository
    # *variables* to also exercise the Google sign-in pop-up and One Tap; without them those tests skip.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Redirects, forms, security headers, robots/sitemap and accessibility for signed-out visitors.
      # The signed-in suite (e2e/auth.spec.ts) needs the API and a test account: run it locally or
      # against staging (docs/testing.md).
      - name: Playwright
        run: pnpm --filter web test:e2e:public

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history: gitleaks reads the commits between the base and this one.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only the commits this push or pull request adds are scanned, so a leak is stopped where it enters.
      # Older history holds credentials that are already known and tracked (docs/codebase-audit.md, B1):
      # rotating them is the fix, and scanning them again on every run would only keep this job red.
      - name: Scan new commits for credentials (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A brand-new branch has no "before" commit (all zeros): scan what it adds on top of main.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base origin/main HEAD)"
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --log-opts="$BASE..HEAD" --redact --no-banner --verbose

  verify:
    name: verify
    if: always()
    needs: [build, browser, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "One or more required jobs did not pass: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All jobs passed"
