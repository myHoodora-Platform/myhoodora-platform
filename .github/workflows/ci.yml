name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types

      # API unit tests (Jest) and web unit tests (Vitest).
      - name: Unit tests
        run: pnpm run test

      # The real API against an in-memory MongoDB replica set; only Firebase is stubbed. No secrets needed.
      - name: API integration tests
        run: pnpm run test:e2e:api

      - name: Build
        run: pnpm run build

  browser:
    name: Browser tests (signed-out flows)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Firebase web config is public (it ships in the browser bundle). Set these as repository
    # *variables* to also exercise the Google sign-in pop-up and One Tap; without them those tests skip.
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # Redirects, forms, security headers, robots/sitemap and accessibility for signed-out visitors.
      # The signed-in suite (e2e/auth.spec.ts) needs the API and a test account: run it locally or
      # against staging (docs/testing.md).
      - name: Playwright
        run: pnpm --filter web test:e2e:public

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
